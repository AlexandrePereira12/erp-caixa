# Nginx público da VPS. O .env ao lado define portas, container e COMPOSE_FILE (que soma o
# override gerado com as redes das empresas).
name: pdv-nginx
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ${NGINX_CONTAINER:-pdv_nginx}
    restart: unless-stopped
    ports:
      - "${NGINX_BIND:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_BIND:-0.0.0.0}:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./sites-enabled:/etc/nginx/sites-enabled:ro
      - ../certbot/etc:/etc/letsencrypt:ro
      - ../certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    # Rede própria para publicar 80/443: o container NUNCA pode ficar só em redes `internal` (as
    # `_edge` das empresas são internas), onde o Docker não publica portas. O override gerado soma
    # as `_edge` a esta, não a substitui.
    networks: [publico]

networks:
  publico:
    name: ${NGINX_CONTAINER:-pdv_nginx}_publico
