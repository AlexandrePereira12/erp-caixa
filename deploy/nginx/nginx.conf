# Nginx único da VPS: termina TLS e roteia cada subdomínio para os containers da empresa.
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Resolução em tempo de requisição: empresa parada não derruba `nginx -t` nem o reload
    # das demais (os proxy_pass usam variável).
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format pdv '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent '
                   '$request_time host=$host rid=$request_id';
    access_log /var/log/nginx/access.log pdv;

    # Login: limite por IP. Folgado de propósito: a equipe de um restaurante costuma sair pelo
    # mesmo IP e abre o turno ao mesmo tempo. O backend audita cada falha de qualquer forma.
    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
    # Troca de senha e renovação de sessão: também alvos de adivinhação com token roubado.
    limit_req_zone $binary_remote_addr zone=sessao:10m rate=30r/m;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Host desconhecido nunca cai em empresa nenhuma.
    server {
        listen 80 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 'ok'; }
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 444; }
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    include /etc/nginx/sites-enabled/*.conf;
}
