# Servidor estático do frontend dentro do container web (porta 8080, sem root).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 'ok'; }

    # Arquivos com hash no nome (Vite): cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota do cliente cai no index.html (sem cache, para pegar deploys novos).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
