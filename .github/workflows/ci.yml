name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Instalar dependências
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e 'backend[dev]'
      - name: Lint
        working-directory: backend
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Postgres de teste (mesmo script de roles da produção)
        run: docker compose -f deploy/dev/compose.test.yml up -d --wait
      - name: Testes
        working-directory: backend
        run: .venv/bin/python -m pytest -q
      - name: Contrato OpenAPI do frontend está em dia
        run: |
          make openapi
          git diff --exit-code frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Tipos da API gerados estão em dia
        run: |
          pnpm gen:api
          git diff --exit-code src/lib/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR -e SC2015 deploy/scripts/*.sh deploy/db/10-roles.sh
      - uses: docker/setup-buildx-action@v3
      - name: Imagens locais (amd64)
        run: |
          docker buildx build --load -f deploy/images/api.Dockerfile -t sistema-pdv-api:dev backend
          docker buildx build --load -f deploy/images/web.Dockerfile -t sistema-pdv-web:dev .
      - name: Isolamento entre empresas, backup, restauração e atualização
        run: bash deploy/scripts/testar-isolamento.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: docker/setup-buildx-action@v3
      - name: Imagens locais (amd64)
        run: |
          docker buildx build --load -f deploy/images/api.Dockerfile -t sistema-pdv-api:dev backend
          docker buildx build --load -f deploy/images/web.Dockerfile -t sistema-pdv-web:dev .
      - name: Dependências e navegador do Playwright
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Fluxo completo no navegador (desktop e celular)
        run: bash deploy/scripts/e2e.sh
      - name: Capturas e traces das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultados
          path: frontend/test-results
